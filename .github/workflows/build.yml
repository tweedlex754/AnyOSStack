name: Build

# Fast feedback on every push/PR: make sure the app packages on all three OSes.
# Produces an unpacked build (no installers, no publish) so it stays quick.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only compiles and never writes back, so the job
# token gets read-only scope instead of inheriting the repository default, which
# can be read/write on every scope. release.yml asks for contents:write because
# it genuinely uploads assets.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfuse2 rpm

      - run: npm ci

      - name: Generate build assets (icons + installer strings)
        run: npm run prebuild

      - name: Package (unpacked, no publish)
        run: npx electron-builder --dir
